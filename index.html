<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🕵️‍♂️ IMPOSTOR GAME</title>
<style>
body { 
  font-family: 'Segoe UI', sans-serif; 
  background: #0d1117; 
  color: #fff; 
  text-align: center; 
  margin: 0; 
  padding: 0; 
}

/* Logo i nagłówek */
header {
  background: #111622;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
}
header img { height: 50px; }
header h1 { font-size: 36px; color: #00d26a; margin: 0; }

/* Przyciski */
button { 
  background: #00d26a; 
  color: black; 
  border: none; 
  border-radius: 12px; 
  padding: 15px 35px; 
  font-size: 18px; 
  margin: 10px 0; 
  cursor: pointer; 
  width: 80%; 
  max-width: 250px; 
}
button:hover { background: #00b85d; }

/* Pola tekstowe */
input { 
  font-size: 18px; 
  padding: 12px; 
  border-radius: 10px; 
  border: 1px solid #ccc; 
  width: 80%; 
  max-width: 250px; 
  text-align: center; 
  margin-bottom: 10px; 
}

/* Panele */
#menu, #hostPanel, #waiting, #votePanel { margin-top: 20px; }
#myName, #result, #voteResults {
  margin: 20px auto;
  padding: 20px;
  background: #1c222b;
  border-radius: 15px;
  box-shadow: 0 0 15px rgba(0, 210, 106, 0.4);
  font-size: 20px;
  width: 80%;
  max-width: 400px;
}
.card { font-weight: bold; font-size: 22px; }
.hidden { display: none; }

/* Głosowanie */
.voteButton {
  display: block;
  margin: 10px auto;
  width: 60%;
}

/* Gracze w pokoju */
#playerList { margin-top: 10px; font-size: 18px; }

/* Karty z hasłem */
.wordCard { 
  margin-top: 20px; 
  padding: 20px; 
  background: #161b22; 
  border-radius: 20px; 
  color: #00d26a;
  text-shadow: 0 0 8px rgba(0,210,106,0.7);
}
</style>
</head>
<body>

<header>
  <img src="logo.png" alt="Logo">
  <h1>IMPOSTOR GAME</h1>
</header>

<div id="menu">
  <input id="playerName" placeholder="Twoje imię">
  <button id="btnCreate">Stwórz grę</button>
  <p>lub</p>
  <input id="joinCode" placeholder="Kod pokoju">
  <button id="btnJoin">Dołącz</button>
</div>

<div id="hostPanel" class="hidden">
  <h2>Kod pokoju: <span id="roomCode"></span></h2>
  <p id="players">Gracze: 0/10</p>
  <div id="playerList"></div>
  <button id="btnStart">Rozdaj role i rozpocznij grę</button>
  <button id="btnNextRound" class="hidden">Rozlosuj kolejną rundę</button>
</div>

<div id="waiting" class="hidden">
  <h2>Oczekiwanie na rozpoczęcie...</h2>
</div>

<div id="myName" class="hidden card"></div>
<div id="result" class="hidden card"></div>

<div id="votePanel" class="hidden card">
  <h3>Głosowanie: Kogo wykluczyć?</h3>
  <div id="voteButtons"></div>
  <button id="btnSubmitVote">Oddaj głos</button>
</div>

<div id="voteResults" class="hidden card"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAy1mE_Q3fJo9W2Aa9EQUqp0L0Bn53XPHc",
  authDomain: "impostor-game-ebc12.firebaseapp.com",
  databaseURL: "https://impostor-game-ebc12-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "impostor-game-ebc12",
  storageBucket: "impostor-game-ebc12.appspot.com",
  messagingSenderId: "561452405867",
  appId: "1:561452405867:web:24fb4cdf0320c2c3488d2e",
  measurementId: "G-DKBLTBFHJ5"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const words = ["OKO","DARMOZJAD","TIKTOK","MEM","NETFLIX","LODY","ROWER","ŻABKA","CARPATH","AGRECOL","PIZZA","PASTA","STARUCH","SIGMA","SNAP","DISCORD","SZKOŁA","TRAMWAJ","WAKACJE","PARK","KOT","PIES","IPHONE","KOMPUTER","FRYZURA","EMOJI","POLICJA","BAN","FLEX","KANAPKA","DŁUGOPIS","KAKTUS","DRIP","DOMÓWKA","HERBATA","MIŁOŚĆ","GRA","FILM","SPORT","PRALKA","SUSHI","TEAM","FACEBOOK","YOUTUBE","POCIĄG","DOM","BUDYNEK","BRAMKA"];

let playerId = Math.random().toString(36).substring(2,9);
let roomRef = null;
let isHost = false;
let playerName = "";
let currentVote = null;

// Funkcje pomocnicze
function randomCode() { return Math.floor(1000 + Math.random() * 9000).toString(); }
function showMyName() {
  const nameDiv = document.getElementById("myName");
  nameDiv.innerText = `Twoje imię: ${playerName}`;
  nameDiv.classList.remove("hidden");
}
function showResult(text) {
  document.getElementById("result").innerText = text;
  document.getElementById("result").classList.remove("hidden");
}
async function updatePlayerList() {
  const snap = await roomRef.get();
  const data = snap.val();
  const playersList = data.players ? Object.values(data.players).map(p => p.name) : [];
  document.getElementById("playerList").innerText = playersList.join(", ");
  document.getElementById("players").innerText = `Gracze: ${playersList.length}/10`;
}

// Tworzenie pokoju
async function createRoom() {
  playerName = document.getElementById("playerName").value.trim();
  if (!playerName) return alert("Podaj imię!");
  playerName += " (HOST)";
  isHost = true;
  showMyName();
  
  const code = randomCode();
  roomRef = db.ref("rooms/" + code);
  await roomRef.set({ players: {}, started: false, votes: {} });
  
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("hostPanel").classList.remove("hidden");
  document.getElementById("roomCode").innerText = code;
  
  const playerRef = db.ref(`rooms/${code}/players/${playerId}`);
  await playerRef.set({ name: playerName });
  
  roomRef.on("value", async snapshot => {
    await updatePlayerList();
    const data = snapshot.val();
    if (data.started && data.roles && data.word) {
      const role = data.roles[playerId];
      if (role === "impostor") showResult("🕵️‍♂️ JESTEŚ IMPOSTOREM!");
      else if (role !== "host") showResult(`🔤 Hasło: ${data.word}`);
    }
    if(data.votes) handleVoting(data.votes);
  });
}

// Dołączenie do pokoju
async function joinRoom() {
  playerName = document.getElementById("playerName").value.trim();
  if (!playerName) return alert("Podaj imię!");
  showMyName();
  
  const code = document.getElementById("joinCode").value.trim();
  if (!code) return alert("Podaj kod pokoju!");
  roomRef = db.ref("rooms/" + code);
  
  const snap = await roomRef.get();
  if (!snap.exists()) return alert("Pokój nie istnieje!");
  
  const playerRef = db.ref(`rooms/${code}/players/${playerId}`);
  await playerRef.set({ name: playerName });
  
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("waiting").classList.remove("hidden");
  
  roomRef.on("value", snapshot => {
    updatePlayerList();
    const data = snapshot.val();
    if (data.started && data.roles && data.word) {
      const role = data.roles[playerId];
      if (role === "impostor") showResult("🕵️‍♂️ JESTEŚ IMPOSTOREM!");
      else if (role !== "host") showResult(`🔤 Hasło: ${data.word}`);
    }
    if(data.votes) handleVoting(data.votes);
  });
}

// Rozpoczęcie gry
async function startGame() {
  const snap = await roomRef.get();
  const data = snap.val();
  const players = Object.keys(data.players || {});
  if(players.length < 3 || players.length > 10) return alert("Potrzebujesz od 3 do 10 graczy!");
  
  const word = words[Math.floor(Math.random() * words.length)];
  const impostor = players[Math.floor(Math.random() * players.length)];
  const roles = {};
  players.forEach(p => roles[p] = (p===impostor) ? "impostor" : "normal");
  roles[playerId] = "host";
  
  await roomRef.update({ started: true, roles, word, votes: {} });
  document.getElementById("btnNextRound").classList.remove("hidden");
  showResult("Runda rozpoczęta!");
  prepareVoting(players);
}

// Przygotowanie głosowania
function prepareVoting(players) {
  const votePanel = document.getElementById("votePanel");
  votePanel.classList.remove("hidden");
  const voteButtons = document.getElementById("voteButtons");
  voteButtons.innerHTML = "";
  players.forEach(p => {
    if(p !== playerId) {
      const btn = document.createElement("button");
      btn.innerText = p;
      btn.classList.add("voteButton");
      btn.onclick = () => currentVote = p;
      voteButtons.appendChild(btn);
    }


// Obsługa oddania głosu
document.getElementById("btnSubmitVote").addEventListener("click", async () => {
  if(!currentVote) return alert("Wybierz gracza!");
  await roomRef.child("votes").child(playerId).set(currentVote);
  alert("Twój głos został oddany!");
});

// Wyświetlanie wyników głosowania
async function handleVoting(votes) {
  const voteValues = Object.values(votes || {});
  if(Object.keys(votes).length === Object.keys((await roomRef.child("players").get()).val()).length){
    // wszystkie głosy oddane
    const results = {};
    voteValues.forEach(v => results[v] = (results[v]||0)+1);
    const maxVotes = Math.max(...Object.values(results));
    const eliminated = Object.keys(results).filter(k=>results[k]===maxVotes);
    
    const voteResults = document.getElementById("voteResults");
    voteResults.innerText = "Wykluczeni: " + eliminated.join(", ");
    voteResults.classList.remove("hidden");
    
    // reset głosowania
    await roomRef.child("votes").remove();
  }
}
<style>
/* Dodaj do istniejącego CSS */

.cardRole {
  margin: 20px auto;
  padding: 25px;
  background: linear-gradient(145deg, #111622, #1a1f2a);
  border: 2px solid #00d26a;
  border-radius: 20px;
  width: 80%;
  max-width: 350px;
  color: #00d26a;
  font-size: 22px;
  font-weight: bold;
  text-shadow: 0 0 10px rgba(0,210,106,0.7);
  animation: pulse 2s infinite alternate;
}

@keyframes pulse {
  from { box-shadow: 0 0 15px rgba(0,210,106,0.3); }
  to { box-shadow: 0 0 25px rgba(0,210,106,0.8); }
}

/* Animacja przycisków głosowania */
.voteButton {
  display: block;
  margin: 10px auto;
  width: 60%;
  padding: 12px;
  font-size: 18px;
  border-radius: 12px;
  border: 1px solid #00d26a;
  background: #111622;
  color: #00d26a;
  cursor: pointer;
  transition: all 0.3s ease;
}
.voteButton:hover {
  transform: scale(1.05);
  background: #00d26a;
  color: black;
  box-shadow: 0 0 15px #00d26a;
}
</style>

document.getElementById("btnCreate").addEventListener("click", createRoom);
document.getElementById("btnJoin").addEventListener("click", joinRoom);
document.getElementById("btnStart").addEventListener("click", startGame);
</script>
</body>
</html>
